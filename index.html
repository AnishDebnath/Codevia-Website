<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Canonical URL & Primary SEO Meta Tags -->
    <title>Codevia — Technology with Purpose</title>
    <meta name="title" content="Codevia — Technology with Purpose" />
    <meta name="description" content="Codevia engineers scalable cloud systems, custom software, UI/UX design, and AI-driven digital products that accelerate modern business growth." />
    <meta name="keywords" content="Codevia, software development, web development, cloud solutions, UI UX design, custom software agency, digital product engineering" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://codevia.ai/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codevia.ai/" />
    <meta property="og:site_name" content="Codevia" />
    <meta property="og:title" content="Codevia — Technology with Purpose" />
    <meta property="og:description" content="We transform ambitious ideas into beautiful, scalable and high-performing digital products that help businesses grow." />
    <meta property="og:image" content="https://codevia.ai/og-cover.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://codevia.ai/" />
    <meta name="twitter:title" content="Codevia — Technology with Purpose" />
    <meta name="twitter:description" content="We transform ambitious ideas into beautiful, scalable and high-performing digital products that help businesses grow." />
    <meta name="twitter:image" content="https://codevia.ai/og-cover.jpeg" />

    <!-- Performance: Preconnect to Font Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Structured Data: Organization & Website JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://codevia.ai/#organization",
          "name": "Codevia",
          "url": "https://codevia.ai/",
          "logo": "https://codevia.ai/favicon.png",
          "description": "Technology consulting and digital engineering studio crafting modern software, web platforms, and AI systems.",
          "sameAs": [
            "https://www.linkedin.com/company/codeviaai/",
            "https://www.instagram.com/codevia.ai?igsi=d25pb2J3YWFtd2Zy"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "codevia.ai@gmail.com",
            "contactType": "customer service"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://codevia.ai/#website",
          "url": "https://codevia.ai/",
          "name": "Codevia",
          "publisher": {
            "@id": "https://codevia.ai/#organization"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
